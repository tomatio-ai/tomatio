<style>
  /* B228 Read later: what the web clipper saved, like Pocket. TomaTío page style (tokens as TíoDay). */
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --fg: #16181d; --muted: #5d6370; --line: #dde1e8; --hd: #eaedf1;
    --accent: var(--ab-accent, #16a34a); --accent-soft: var(--ab-accent-soft, #dcfce7); --accent-ink: var(--ab-accent-ink, #15803d); --on-accent: var(--ab-on-accent, #0b0d12);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.07);
    --font: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111318; --surface: #191c23; --fg: #e8eaf0; --muted: #9aa1ae; --line: #2c313b; --hd: #1c2028;
      --accent: var(--ab-accent-dark, #4ade80); --accent-soft: var(--ab-accent-soft-dark, #12301d); --accent-ink: var(--ab-accent-dark, #4ade80);
    }
  }
  :root[data-theme="dark"] {
    --bg: #111318; --surface: #191c23; --fg: #e8eaf0; --muted: #9aa1ae; --line: #2c313b; --hd: #1c2028;
    --accent: var(--ab-accent-dark, #4ade80); --accent-soft: var(--ab-accent-soft-dark, #12301d); --accent-ink: var(--ab-accent-dark, #4ade80);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.0625rem; margin-bottom: 18px; }
  .brand img { width: 32px; height: 32px; border-radius: 7px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -.01em; }
  .meta { color: var(--muted); margin: 0 0 18px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .tabs { display: inline-flex; background: var(--hd); border-radius: 10px; padding: 3px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .9375rem; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }
  .tabs .n { margin-left: 6px; font-size: .8125rem; color: var(--muted); font-weight: 400; }
  .find { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 8px 12px; font: inherit; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: .8125rem; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li.clip { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  li.clip.read .title { color: var(--muted); font-weight: 500; }
  .title { font-weight: 650; font-size: 1.0625rem; color: var(--fg); text-decoration: none; overflow-wrap: anywhere; }
  .title:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: .875rem; margin-top: 2px; overflow-wrap: anywhere; }
  .excerpt { margin: 8px 0 0; font-size: .9375rem; overflow-wrap: anywhere; }
  .note { margin: 8px 0 0; font-size: .9375rem; border-left: 3px solid var(--accent); padding-left: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .foot { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 10px; }
  .tag { font-size: .8125rem; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }
  .actions { margin-left: auto; display: flex; gap: 6px; }
  .actions button { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: .8125rem; cursor: pointer; }
  .actions button:hover { background: var(--hd); }
  .actions button:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); text-align: center; padding: 40px 12px; border: 1px dashed var(--line); border-radius: 12px; }
  .msg { color: var(--muted); font-size: .875rem; min-height: 1.3em; margin-top: 10px; }
  @media (max-width: 520px) { .actions { margin-left: 0; width: 100%; } h1 { font-size: 1.5rem; } }
</style>
</head>

</div>
<script>
(function () {
  'use strict';
  var state = { docs: [], tab: 'unread', tag: '', find: '', busy: {} };
  var $ = function (id) { return document.getElementById(id); };

  function store() { return window.tomatio && window.tomatio.store ? window.tomatio.store : null; }
  function clips() {
    return state.docs.filter(function (d) { return d && d.value && typeof d.value === 'object' && typeof d.value.url === 'string'; });
  }
  function stateOf(d) { var s = d.value.state; return s === 'read' || s === 'archived' ? s : 'unread'; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : '#'; }
  function when(iso) {
    var t = Date.parse(iso || ''); if (!t) return '';
    try { return new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return iso.slice(0, 10); }
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render() {
    var all = clips();
    ['unread', 'read', 'archived'].forEach(function (s) {
      var n = all.filter(function (d) { return stateOf(d) === s; }).length;
      $('n-' + s).textContent = n ? String(n) : '';
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-tab') === state.tab ? 'true' : 'false'); });

    var inTab = all.filter(function (d) { return stateOf(d) === state.tab; });
    var tags = {};
    inTab.forEach(function (d) { (d.value.tags || []).forEach(function (t) { if (typeof t === 'string') tags[t] = (tags[t] || 0) + 1; }); });
    var row = $('tags'); row.textContent = '';
    Object.keys(tags).sort().forEach(function (t) {
      var b = el('button', 'chip', '#' + t); b.type = 'button';
      b.setAttribute('aria-pressed', state.tag === t ? 'true' : 'false');
      b.addEventListener('click', function () { state.tag = state.tag === t ? '' : t; render(); });
      row.appendChild(b);
    });
    if (state.tag && !tags[state.tag]) state.tag = '';

    var q = state.find.toLowerCase();
    var shown = inTab.filter(function (d) {
      var v = d.value;
      if (state.tag && (v.tags || []).indexOf(state.tag) < 0) return false;
      if (!q) return true;
      return [v.title, v.site, v.note, v.excerpt, v.url].some(function (s) { return typeof s === 'string' && s.toLowerCase().indexOf(q) >= 0; });
    }).sort(function (a, b) { return String(b.value.clipped_at || b.value.saved_at || '').localeCompare(String(a.value.clipped_at || a.value.saved_at || '')); });

    var list = $('list'); list.textContent = '';
    if (!shown.length) {
      var empty = el('li', 'empty', all.length ? 'Nothing here.' : 'Nothing saved yet. Clip a page with the TomaTío web clipper and it shows up here.');
      list.appendChild(empty);
      return;
    }
    shown.forEach(function (d) { list.appendChild(item(d)); });
  }

  function item(d) {
    var v = d.value, s = stateOf(d);
    var li = el('li', 'clip' + (s === 'read' ? ' read' : ''));
    var a = el('a', 'title', v.title || v.url);
    a.href = safeUrl(v.url); a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.addEventListener('click', function () { if (s === 'unread') setState(d, 'read'); });
    li.appendChild(a);
    var sub = [v.site, v.author, v.mode === 'bookmark' ? 'Bookmark' : (v.mode === 'selection' ? 'Selection' : ''), when(v.saved_at) ? 'Saved ' + when(v.saved_at) : ''].filter(Boolean).join(' · ');
    li.appendChild(el('div', 'sub', sub));
    if (v.note) li.appendChild(el('p', 'note', v.note));
    else if (v.excerpt) li.appendChild(el('p', 'excerpt', v.excerpt));
    var foot = el('div', 'foot');
    (v.tags || []).forEach(function (t) { if (typeof t === 'string') foot.appendChild(el('span', 'tag', '#' + t)); });
    var acts = el('div', 'actions');
    function btn(label, to) {
      var b = el('button', '', label); b.type = 'button'; b.disabled = !!state.busy[d.key];
      b.addEventListener('click', function () { setState(d, to); });
      acts.appendChild(b);
    }
    var open = el('button', '', 'Open'); open.type = 'button';
    open.addEventListener('click', function () { window.open(safeUrl(v.url), '_blank', 'noopener'); if (s === 'unread') setState(d, 'read'); });
    acts.appendChild(open);
    if (s === 'unread') { btn('Mark read', 'read'); btn('Archive', 'archived'); }
    if (s === 'read') { btn('Mark unread', 'unread'); btn('Archive', 'archived'); }
    if (s === 'archived') { btn('Back to unread', 'unread'); }
    foot.appendChild(acts);
    li.appendChild(foot);
    return li;
  }

  function setState(d, to) {
    var s = store(); if (!s || state.busy[d.key]) return;
    state.busy[d.key] = true;
    var patch = { state: to };
    if (to === 'read') patch.read_at = new Date().toISOString();
    if (to === 'archived') patch.archived_at = new Date().toISOString();
    s.update('clips', d.key, patch, { expectedVersion: d.version }).then(function (doc) {
      state.busy[d.key] = false;
      replace(doc && doc.key ? doc : null, d, patch);
      $('msg').textContent = to === 'archived' ? 'Archived.' : (to === 'read' ? 'Marked read.' : 'Back in Unread.');
      render();
    }).catch(function () {
      // Someone (the clipper) changed it meanwhile: read it again, once.
      state.busy[d.key] = false;
      $('msg').textContent = 'That changed meanwhile; showing it as it is now.';
      load();
    });
  }
  function replace(doc, old, patch) {
    for (var i = 0; i < state.docs.length; i++) {
      if (state.docs[i].key === old.key) {
        if (doc) state.docs[i] = doc;
        else { var v = {}; Object.keys(old.value).forEach(function (k) { v[k] = old.value[k]; }); Object.keys(patch).forEach(function (k) { v[k] = patch[k]; }); state.docs[i] = { key: old.key, value: v, version: (old.version || 0) + 1 }; }
        return;
      }
    }
  }

  function load() {
    var s = store();
    if (!s) { $('meta').textContent = 'Open this page from its TomaTío link to see what you saved.'; render(); return; }
    s.list('clips').then(function (docs) { state.docs = docs || []; render(); }).catch(function () {
      var m = /[?&]r=(\d+)/.exec(window.location.search);
      if (!m || Date.now() - Number(m[1]) > 120000) { window.location.replace(window.location.pathname + '?r=' + Date.now()); return; }
      $('meta').textContent = 'Could not load your list. Open the Read later link again, signed in to the brain.';
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.addEventListener('click', function () { state.tab = b.getAttribute('data-tab'); state.tag = ''; $('msg').textContent = ''; render(); });
  });
  $('find').addEventListener('input', function () { state.find = this.value.trim(); render(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(); });
  load();
})();
</script>
</body>
</html>
